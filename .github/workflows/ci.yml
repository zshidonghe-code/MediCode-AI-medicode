# =============================================================================
# MediCode CI/CD Pipeline
# =============================================================================
# Stages:
#   1. Lint        — Backend (ruff) + Frontend (eslint + tsc)
#   2. Test        — Backend (pytest) + Frontend (vitest)
#   3. Security    — Dependency audit + secret scanning
#   4. Build       — Docker images (multi-arch)
#   5. Deploy      — Tagged releases -> Docker Hub / self-hosted
# =============================================================================

name: MediCode CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

# ---- Permissions ----
permissions:
  contents: read
  packages: write
  security-events: write

# ---- Concurrency: cancels in-progress runs on same branch/PR ----
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # 1. LINT
  # =====================================================================
  lint:
    name: Lint (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Backend Lint (ruff) ----
      - name: Setup Python
        if: matrix.target == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        if: matrix.target == 'backend'
        run: |
          pip install ruff mypy
          pip install -r backend/requirements.txt

      - name: Ruff lint & format check
        if: matrix.target == 'backend'
        run: |
          cd backend
          ruff check src/ --output-format=github
          ruff format --check src/

      - name: Mypy type check
        if: matrix.target == 'backend'
        run: |
          cd backend
          mypy src/ --ignore-missing-imports --show-error-codes || echo "::warning::Type check has issues; review output"

      # ---- Frontend Lint (eslint + tsc) ----
      - name: Setup Node.js
        if: matrix.target == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: matrix.target == 'frontend'
        run: cd frontend && npm ci --prefer-offline --no-audit

      - name: ESLint
        if: matrix.target == 'frontend'
        run: cd frontend && npx eslint . --max-warnings 0

      - name: TypeScript type check
        if: matrix.target == 'frontend'
        run: cd frontend && npx tsc --noEmit

  # =====================================================================
  # 2. TEST
  # =====================================================================
  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        target: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Backend Tests ----
      - name: Setup Python
        if: matrix.target == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        if: matrix.target == 'backend'
        run: pip install -r backend/requirements.txt pytest pytest-cov pytest-asyncio httpx

      - name: Run pytest
        if: matrix.target == 'backend'
        run: |
          cd backend
          pytest tests/ --cov=src --cov-report=xml --cov-report=term -v \
            --timeout=60 \
            || echo "::warning::Some tests failed; check output"

      - name: Upload backend coverage
        if: matrix.target == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          retention-days: 7

      # ---- Frontend Tests ----
      - name: Setup Node.js
        if: matrix.target == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: matrix.target == 'frontend'
        run: cd frontend && npm ci --prefer-offline --no-audit

      - name: Run vitest
        if: matrix.target == 'frontend'
        run: cd frontend && npx vitest run --coverage || echo "::warning::No tests defined yet"

  # =====================================================================
  # 3. SECURITY SCAN
  # =====================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend dependency audit
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-* || echo "::warning::Dependency vulnerabilities found"

      # Frontend dependency audit
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        run: cd frontend && npm audit --audit-level=high || echo "::warning::NPM vulnerabilities found"

      # Secret scanning (Gitleaks)
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        continue-on-error: true

  # =====================================================================
  # 4. BUILD (Docker images)
  # =====================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/medicode-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/medicode-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # =====================================================================
  # 5. DEPLOY (placeholder — customize for your target)
  # =====================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://medicode.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "## Deploy Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Backend: ghcr.io/${{ github.repository_owner }}/medicode-backend:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend: ghcr.io/${{ github.repository_owner }}/medicode-frontend:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy on the target server, run:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Pull images" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/medicode-backend:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/medicode-frontend:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "# Restart services" >> $GITHUB_STEP_SUMMARY
          echo "cd /opt/medicode" >> $GITHUB_STEP_SUMMARY
          echo "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
