# =============================================================================
# MediCode Production Overrides
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  backend:
    restart: always
    volumes:
      # No source-code mount in production (use the baked-in image)
      - medicode_data:/app/data
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
    # Production: gunicorn with multiple uvicorn workers
    command:
      - gunicorn
      - src.main:app
      - --worker-class
      - uvicorn.workers.UvicornWorker
      - --bind
      - "0.0.0.0:8000"
      - --workers
      - "${GUNICORN_WORKERS:-4}"
      - --timeout
      - "${GUNICORN_TIMEOUT:-120}"
      - --graceful-timeout
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --log-level
      - "${LOG_LEVEL:-warning}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
