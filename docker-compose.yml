version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicode-postgres
    environment:
      POSTGRES_USER: medicode
      POSTGRES_PASSWORD: medicode
      POSTGRES_DB: medicode
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicode"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicode-backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://medicode:medicode@postgres:5432/medicode
      - DATABASE_SYNC_URL=postgresql://medicode:medicode@postgres:5432/medicode
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medicode-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
