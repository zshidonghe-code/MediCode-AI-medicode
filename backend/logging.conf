[loggers]
keys = root,uvicorn,gunicorn,sqlalchemy,alembic,medicode

[handlers]
keys = console,file

[formatters]
keys = standard,json

[logger_root]
level = INFO
handlers = console

[logger_uvicorn]
level = INFO
handlers = console
qualname = uvicorn
propagate = 0

[logger_gunicorn]
level = INFO
handlers = console
qualname = gunicorn
propagate = 0

[logger_sqlalchemy]
level = WARNING
handlers = console
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers = console
qualname = alembic
propagate = 0

[logger_medicode]
level = DEBUG
handlers = console,file
qualname = src
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = DEBUG
formatter = standard

[handler_file]
class = logging.handlers.RotatingFileHandler
args = ('/app/data/medicode.log', 'a', 10485760, 5)  # 10 MB, 5 backups
level = DEBUG
formatter = json

[formatter_standard]
format = [%(asctime)s] %(levelname)-8s %(name)s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[formatter_json]
format = {"time": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "message": "%(message)s"}
datefmt = %Y-%m-%dT%H:%M:%S
